name: Release Libraries

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release operation mode"
        type: choice
        required: true
        default: prepare
        options:
          - prepare
          - publish
      ref:
        description: "Git ref to release from"
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: release-libs-${{ github.event.inputs.ref || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify libraries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify all library quality gates
        run: pnpm run ci:libs

  prepare-release-pr:
    name: Prepare release PR
    if: github.event.inputs.mode == 'prepare'
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    if: github.event.inputs.mode == 'publish'
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Guard publish mode to main
        run: |
          if [ "${{ github.event.inputs.ref }}" != "main" ] && [ "${{ github.event.inputs.ref }}" != "refs/heads/main" ]; then
            echo "Publish mode is only allowed for ref 'main' or 'refs/heads/main'."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate NPM token is present
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required for publish mode."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish changed packages
        run: pnpm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Write run summary
        run: |
          echo "### Release completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.event.inputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
