<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSC Service Worker Playground</title>
    <style>
      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #12121a;
        --bg-tertiary: #1a1a25;
        --text-primary: #e8e8ed;
        --text-secondary: #9898a8;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --success: #22c55e;
        --error: #ef4444;
        --border: #2a2a3a;
        --font-mono: "JetBrains Mono", "Fira Code", monospace;
        --font-sans: "Inter", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        line-height: 1.6;
      }

      #root {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
      }

      .header {
        text-align: center;
        margin-bottom: 3rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--border);
      }

      .header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }

      .header p {
        color: var(--text-secondary);
        font-size: 1.1rem;
      }

      .status-bar {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 9999px;
        font-size: 0.875rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-secondary);
      }

      .status-dot.active {
        background: var(--success);
        box-shadow: 0 0 8px var(--success);
      }

      .status-dot.error {
        background: var(--error);
        box-shadow: 0 0 8px var(--error);
      }

      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn:hover:not(:disabled) {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: var(--bg-tertiary);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--border);
      }

      .counter {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        background: var(--bg-tertiary);
        border-radius: 8px;
        margin-top: 1rem;
      }

      .counter-value {
        font-size: 3rem;
        font-weight: 700;
        font-family: var(--font-mono);
        min-width: 100px;
        text-align: center;
        color: var(--accent);
      }

      .counter-buttons {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .log-container {
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        max-height: 300px;
        overflow-y: auto;
        font-family: var(--font-mono);
        font-size: 0.85rem;
      }

      .log-entry {
        padding: 0.25rem 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 0.75rem;
      }

      .log-entry:last-child {
        border-bottom: none;
      }

      .log-time {
        color: var(--text-secondary);
        flex-shrink: 0;
      }

      .log-type {
        font-weight: 600;
        flex-shrink: 0;
        min-width: 60px;
      }

      .log-type.info { color: var(--accent); }
      .log-type.success { color: var(--success); }
      .log-type.error { color: var(--error); }
      .log-type.rsc { color: #a855f7; }

      .rsc-content {
        padding: 1.5rem;
        background: var(--bg-tertiary);
        border-radius: 8px;
        margin-top: 1rem;
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: var(--text-secondary);
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 0.75rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .error-message {
        padding: 1rem;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid var(--error);
        border-radius: 8px;
        color: var(--error);
        margin-top: 1rem;
      }

      .code-block {
        background: var(--bg-primary);
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="spinner"></div>
        Loading RSC Playground...
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
